  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test título de transportista</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- La estructura HTML principal se mantiene igual que en la versión anterior -->
  <div class="app">
    <h1>Test título de transportista</h1>
    <!-- El texto de subtítulo se generará desde data.js con los totales actuales -->
    <p class="subtitle" id="subtitle"></p>
    <div class="card">
      <div class="controls">
        <div class="control-group">
          <label for="testTypeSelect">Tipo de test</label>
          <select id="testTypeSelect">
            <option value="objetivas" selected>Preguntas tipo test</option>
            <option value="supuestos">Supuestos prácticos</option>
          </select>
        </div>
        <div class="control-group">
          <label for="modeSelect">Modo de selección</label>
          <select id="modeSelect">
            <option value="all" selected>Todas mezcladas</option>
            <option value="block">Por bloque</option>
            <option value="topic">Por subtema</option>
          </select>
        </div>
        <div class="control-group" id="blockGroup" style="display:none;">
          <label for="blockSelect">Bloque</label>
          <select id="blockSelect"></select>
        </div>
        <div class="control-group" id="topicGroup" style="display:none;">
          <label for="topicSelect">Subtema</label>
          <select id="topicSelect"></select>
        </div>
        <div class="control-group">
          <label for="checkMode">Tipo de corrección</label>
          <select id="checkMode">
            <option value="practice">Inmediata (modo práctica)</option>
            <option value="exam" selected>Al finalizar (modo examen)</option>
          </select>
        </div>
        <div class="control-group">
          <label for="numQuestions">Número de preguntas</label>
          <input id="numQuestions" type="number" min="1" max="200" value="200" />
        </div>
        <div class="control-group" style="margin-top:auto;">
          <label>&nbsp;</label>
          <button class="primary" id="startBtn">Empezar test</button>
        </div>
      </div>

      <div id="testArea" style="display:none;">
        <div class="q-meta" id="qMeta"></div>
        <div class="question-text" id="qText"></div>
        <ul class="options" id="optionsList"></ul>
        <div class="q-meta" id="feedbackText" style="margin-top:0.25rem;font-weight:500;"></div>
        <div class="q-meta" id="normaText" style="margin-top:0.1rem;"></div>
        <div class="bottom-bar">
          <div style="display:flex;gap:0.5rem;">
            <button class="secondary" id="prevBtn">Anterior</button>
            <button class="secondary" id="nextBtn">Siguiente</button>
          </div>
          <div style="display:flex;gap:0.5rem;align-items:center;">
            <button class="primary" id="finishBtn">Corregir test</button>
            <span id="progressText"></span>
          </div>
        </div>
        <div id="scoreBox"></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    // Rellenar el subtítulo dinámicamente con los totales definidos en data.js
    (function() {
      if (window.ALL_QUESTIONS && window.ALL_SUPUESTOS) {
        var subt = document.getElementById('subtitle');
        subt.textContent = 'Banco: ' + ALL_QUESTIONS.length + ' preguntas tipo test y ' + ALL_SUPUESTOS.length + ' supuestos prácticos.';
      }
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
